<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <style>
        header{
        background-color: rgb(127, 167, 62);
        color: blueviolet;
        text-align: center;
        max-width: 800px;
        margin: 0 auto; 
        border: 5px solid royalblue;
        padding: 16px;
        }
        main{
         background-color: brown;
         color: blue;
         text-align: center;
         max-width: 800px;
         margin: 0 auto;
         display: flex;
         p.autor{
            font-weight: bold;
         }
        }
        img{
           width: 80px;
           height: 80px;
        }
     </style>
</head>
<body>
    <header>
         <h1>bate estaca</h1>
         <p>saroba</p> 
    </header>
 <main>
    <img src="imagem.jpeg" alt=" macaco em cima de cavalo ">
    <div>     
   <h2>hoje tem</h2>
   <p class="autor"> por: Gabriel Vertuan</p>
    <p>hoje eu vou comer uma perereca</p>
    <button>🦁<span>0</span></button>
    </div>
   </main> 
</body>
<script>
   const botao = document.querySelector("button")
   botao.addEventListener("click" , botaoClicado)
   function botaoClicado () {
      let texto = botao.querySelector("span")
      texto.textContent++;
   }
</script>
</html>
